name: Cập nhật dữ liệu & xuất bản trang

on:
  schedule:
    # Giờ UTC. 02:00–08:00 UTC = 9:00–15:00 giờ VN, thứ 2 – thứ 6, mỗi 15 phút
    - cron: "*/15 2-8 * * 1-5"
    # Sau giờ đóng cửa (16:30 VN) và cuối tuần để có dữ liệu chốt phiên
    - cron: "30 9 * * 1-5"
    - cron: "0 3 * * 6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tạo trang
        run: python scripts/build_site.py site
      - name: Lấy giá và tin tức
        run: python scripts/fetch_data.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
